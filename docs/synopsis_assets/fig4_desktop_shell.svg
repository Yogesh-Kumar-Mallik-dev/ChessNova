<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="920" height="320">
  <rect width="920" height="320" fill="#ffffff" />
  <defs>
    <marker id="arrow4" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b" />
    </marker>
  </defs>

  <!-- Outer Box: Tauri Desktop App -->
  <rect x="30" y="20" width="860" height="270" rx="8" fill="#f8fafc" stroke="#6366f1" stroke-width="1.5" />
  <text x="50" y="45" font-family="Times New Roman, serif" font-size="14" font-weight="bold" fill="#3730a3">TAURI v2 CROSS-PLATFORM NATIVE CONTAINER (apps/desktop)</text>

  <!-- Rust Native Core -->
  <rect x="50" y="65" width="370" height="205" rx="6" fill="#ffffff" stroke="#4338ca" stroke-width="1.5" />
  <text x="235" y="90" font-family="Times New Roman, serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#312e81">Rust Native Runtime (chessnova_lib)</text>
  
  <rect x="70" y="110" width="330" height="35" rx="4" fill="#e0e7ff" stroke="#818cf8" stroke-width="1" />
  <text x="235" y="132" font-family="Times New Roman, serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#3730a3">Frameless Window Controller (decorations: false)</text>

  <rect x="70" y="155" width="330" height="35" rx="4" fill="#e0e7ff" stroke="#818cf8" stroke-width="1" />
  <text x="235" y="177" font-family="Times New Roman, serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#3730a3">System Tray (Show/Quit App, Background Persistence)</text>

  <rect x="70" y="200" width="330" height="50" rx="4" fill="#e0e7ff" stroke="#818cf8" stroke-width="1" />
  <text x="235" y="222" font-family="Times New Roman, serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#3730a3">Native Notification Plugin</text>
  <text x="235" y="238" font-family="Times New Roman, serif" font-size="10" text-anchor="middle" fill="#4338ca">Opponent Move, Match Start, Draw Alerts</text>

  <!-- Bi-directional IPC Bridge -->
  <line x1="420" y1="165" x2="490" y2="165" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow4)" />
  <line x1="490" y1="180" x2="420" y2="180" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow4)" />
  <text x="455" y="150" font-family="Times New Roman, serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#475569">IPC Bridge</text>

  <!-- Webview Container -->
  <rect x="495" y="65" width="370" height="205" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
  <text x="680" y="90" font-family="Times New Roman, serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0369a1">Embedded WebKit2GTK / WebView2</text>

  <rect x="515" y="110" width="330" height="35" rx="4" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1" />
  <text x="680" y="132" font-family="Times New Roman, serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#0369a1">Custom Frameless Titlebar (DesktopTitlebar.svelte)</text>

  <rect x="515" y="155" width="330" height="35" rx="4" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1" />
  <text x="680" y="177" font-family="Times New Roman, serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#0369a1">Static SPA Bundle (index.html, router, stores)</text>

  <rect x="515" y="200" width="330" height="50" rx="4" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1" />
  <text x="680" y="222" font-family="Times New Roman, serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#0369a1">Hardware-Accelerated Chess Board</text>
  <text x="680" y="238" font-family="Times New Roman, serif" font-size="10" text-anchor="middle" fill="#0284c7">Vector SVG Staunton Pieces &amp; Sound Engine</text>
</svg>