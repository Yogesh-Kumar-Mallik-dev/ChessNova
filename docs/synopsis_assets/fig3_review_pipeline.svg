<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="920" height="380">
  <rect width="920" height="380" fill="#ffffff" />
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b" />
    </marker>
  </defs>

  <!-- Block 1: Move Feed -->
  <rect x="30" y="70" width="160" height="90" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" />
  <text x="110" y="105" font-family="Times New Roman, serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">PGN / Move List</text>
  <text x="110" y="125" font-family="Times New Roman, serif" font-size="11" text-anchor="middle" fill="#475569">Chronological FEN</text>
  <text x="110" y="142" font-family="Times New Roman, serif" font-size="10" text-anchor="middle" fill="#64748b">Positions Generated</text>

  <line x1="190" y1="115" x2="235" y2="115" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow3)" />

  <!-- Block 2: Stockfish UCI Evaluation -->
  <rect x="235" y="70" width="190" height="90" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5" />
  <text x="330" y="105" font-family="Times New Roman, serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#047857">Stockfish 19 UCI</text>
  <text x="330" y="125" font-family="Times New Roman, serif" font-size="11" text-anchor="middle" fill="#475569">Multi-PV Search</text>
  <text x="330" y="142" font-family="Times New Roman, serif" font-size="10" text-anchor="middle" fill="#065f46">Centipawn (cp) &amp; Mate</text>

  <line x1="425" y1="115" x2="470" y2="115" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow3)" />

  <!-- Block 3: Logistic Win Probability -->
  <rect x="470" y="70" width="200" height="90" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
  <text x="570" y="100" font-family="Times New Roman, serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1d4ed8">Win Probability Curve</text>
  <text x="570" y="123" font-family="Times New Roman, serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e40af">W = 1 / (1 + 10^(-C/400))</text>
  <text x="570" y="143" font-family="Times New Roman, serif" font-size="10" text-anchor="middle" fill="#64748b">Normalized Range [0.0, 1.0]</text>

  <line x1="670" y1="115" x2="715" y2="115" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow3)" />

  <!-- Block 4: Move Classification -->
  <rect x="715" y="70" width="180" height="90" rx="8" fill="#fdf4ff" stroke="#a855f7" stroke-width="1.5" />
  <text x="805" y="102" font-family="Times New Roman, serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#7e22ce">Move Quality</text>
  <text x="805" y="122" font-family="Times New Roman, serif" font-size="11" text-anchor="middle" fill="#475569">Brilliant, Best, Good,</text>
  <text x="805" y="140" font-family="Times New Roman, serif" font-size="11" text-anchor="middle" fill="#475569">Inaccuracy, Blunder</text>

  <!-- Connectors downwards to phase aggregation -->
  <line x1="570" y1="160" x2="570" y2="210" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow3)" />

  <!-- Phased Aggregation Block -->
  <rect x="235" y="215" width="530" height="120" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" />
  <text x="500" y="245" font-family="Times New Roman, serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#b45309">Phased CAPS Accuracy &amp; Elo Estimation</text>

  <rect x="255" y="260" width="140" height="60" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="325" y="285" font-family="Times New Roman, serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">Opening Phase</text>
  <text x="325" y="305" font-family="Times New Roman, serif" font-size="10" text-anchor="middle" fill="#64748b">ECO Book Detection</text>

  <rect x="430" y="260" width="140" height="60" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="500" y="285" font-family="Times New Roman, serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">Middlegame Phase</text>
  <text x="500" y="305" font-family="Times New Roman, serif" font-size="10" text-anchor="middle" fill="#64748b">Tactical Swing Analysis</text>

  <rect x="605" y="260" width="140" height="60" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="675" y="285" font-family="Times New Roman, serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">Endgame Phase</text>
  <text x="675" y="305" font-family="Times New Roman, serif" font-size="10" text-anchor="middle" fill="#64748b">Sub-10 Piece Accuracy</text>
</svg>