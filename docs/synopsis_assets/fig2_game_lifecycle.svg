<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="920" height="480">
  <rect width="920" height="480" fill="#ffffff" />
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b" />
    </marker>
  </defs>

  <!-- Step 1: Matchmaking -->
  <rect x="30" y="60" width="160" height="80" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5" />
  <text x="110" y="95" font-family="Times New Roman, serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0369a1">Matchmaking</text>
  <text x="110" y="115" font-family="Times New Roman, serif" font-size="11" text-anchor="middle" fill="#475569">Queue Insertion</text>
  <text x="110" y="130" font-family="Times New Roman, serif" font-size="10" text-anchor="middle" fill="#64748b">Tolerance: ±50 to ±300</text>

  <line x1="190" y1="100" x2="230" y2="100" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow2)" />

  <!-- Step 2: Room Creation -->
  <rect x="230" y="60" width="170" height="80" rx="8" fill="#fdf4ff" stroke="#a855f7" stroke-width="1.5" />
  <text x="315" y="95" font-family="Times New Roman, serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#7e22ce">Game Allocation</text>
  <text x="315" y="115" font-family="Times New Roman, serif" font-size="11" text-anchor="middle" fill="#475569">WebSocket Hub Room</text>
  <text x="315" y="130" font-family="Times New Roman, serif" font-size="10" text-anchor="middle" fill="#64748b">Clocks &amp; FEN Initialized</text>

  <line x1="400" y1="100" x2="440" y2="100" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow2)" />

  <!-- Step 3: Turn Execution -->
  <rect x="440" y="30" width="220" height="140" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5" />
  <text x="550" y="58" font-family="Times New Roman, serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">Turn-by-Turn Move Loop</text>
  
  <rect x="455" y="70" width="190" height="30" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="550" y="90" font-family="Times New Roman, serif" font-size="11" text-anchor="middle" fill="#1e293b">1. Client Dispatches Move (UCI)</text>

  <rect x="455" y="105" width="190" height="30" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="550" y="125" font-family="Times New Roman, serif" font-size="11" text-anchor="middle" fill="#1e293b">2. FIDE Engine Validates &amp; Applies</text>

  <rect x="455" y="140" width="190" height="25" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="550" y="157" font-family="Times New Roman, serif" font-size="10" text-anchor="middle" fill="#1e293b">3. Clocks Toggled &amp; Broadcast</text>

  <line x1="660" y1="100" x2="710" y2="100" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow2)" />

  <!-- Step 4: Decision Diamond -->
  <polygon points="760,60 830,100 760,140 690,100" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" />
  <text x="760" y="98" font-family="Times New Roman, serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#b45309">Terminal</text>
  <text x="760" y="112" font-family="Times New Roman, serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#b45309">State?</text>

  <!-- Loop back arrow if not finished -->
  <path d="M 760 60 L 760 20 L 550 20 L 550 28" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrow2)" />
  <text x="655" y="15" font-family="Times New Roman, serif" font-size="10" fill="#64748b">No (Next Turn)</text>

  <!-- Line to Termination -->
  <line x1="760" y1="140" x2="760" y2="200" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow2)" />
  <text x="770" y="175" font-family="Times New Roman, serif" font-size="10" font-weight="bold" fill="#047857">Yes</text>

  <!-- Step 5: Termination Modes -->
  <rect x="660" y="200" width="200" height="110" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" />
  <text x="760" y="225" font-family="Times New Roman, serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#b91c1c">Game Termination</text>
  <text x="760" y="248" font-family="Times New Roman, serif" font-size="11" text-anchor="middle" fill="#475569">• Checkmate / Stalemate</text>
  <text x="760" y="268" font-family="Times New Roman, serif" font-size="11" text-anchor="middle" fill="#475569">• Resignation / Abandonment</text>
  <text x="760" y="288" font-family="Times New Roman, serif" font-size="11" text-anchor="middle" fill="#475569">• 3-Fold / 50-Move / Draw Offer</text>

  <!-- Line to Post Game Services -->
  <line x1="660" y1="255" x2="490" y2="255" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow2)" />

  <!-- Step 6: Post-Game Rating & Archival -->
  <rect x="230" y="210" width="260" height="90" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5" />
  <text x="360" y="235" font-family="Times New Roman, serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#047857">Rating Adjustment &amp; Archival</text>
  <text x="360" y="258" font-family="Times New Roman, serif" font-size="11" text-anchor="middle" fill="#475569">• Elo Recalculation (K-Factor 16/32, Min 100)</text>
  <text x="360" y="278" font-family="Times New Roman, serif" font-size="11" text-anchor="middle" fill="#475569">• MongoDB Permanent Match Record</text>

  <!-- Line to Review -->
  <line x1="360" y1="300" x2="360" y2="350" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow2)" />

  <!-- Step 7: Post-Game Review Laboratory -->
  <rect x="210" y="350" width="300" height="90" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
  <text x="360" y="375" font-family="Times New Roman, serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1d4ed8">Stockfish Post-Game Laboratory</text>
  <text x="360" y="398" font-family="Times New Roman, serif" font-size="11" text-anchor="middle" fill="#475569">• CAPS Win Probability &amp; Phased Accuracy</text>
  <text x="360" y="418" font-family="Times New Roman, serif" font-size="11" text-anchor="middle" fill="#475569">• Move Classification (Brilliant to Blunder)</text>
</svg>