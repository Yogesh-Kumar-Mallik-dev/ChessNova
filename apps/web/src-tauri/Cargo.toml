[package]
name = "chessnova"
version = "0.1.0"
description = "ChessNova Modern Chess Desktop Application"
authors = ["ChessNova Team"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "chessnova_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.3" }
tauri-plugin-log = "2"
