name: Desktop Release & Cross-Compilation

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_draft:
        description: 'Publish as Draft Release on GitHub'
        required: true
        type: boolean
        default: false

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
            bundle_ext: 'dmg, app'
          - platform: 'ubuntu-22.04'
            args: ''
            bundle_ext: 'AppImage, deb'
          - platform: 'windows-latest'
            args: ''
            bundle_ext: 'msi, exe'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/desktop/package-lock.json

      - name: Install Linux GUI Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Frontend Dependencies
        run: |
          npm --prefix apps/web ci || npm --prefix apps/web install
          npm --prefix apps/desktop ci || npm --prefix apps/desktop install

      - name: Build Web Frontend Assets
        run: npm --prefix apps/web run build

      - name: Build Tauri Desktop Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: './apps/desktop'
          tagName: ${{ github.ref_name }}
          releaseName: 'ChessPasant Desktop ${{ github.ref_name }}'
          releaseBody: |
            ## ChessPasant Desktop (${{ github.ref_name }})

            Welcome to the official cross-platform desktop release of **ChessPasant** — a modern, distraction-free chess platform and tactical analysis laboratory engineered with **Rust** and **Tauri v2**.

            ---

            ### Official Download Packages

            | Platform | Package | Architecture | Target |
            | :--- | :--- | :--- | :--- |
            | <img src="https://raw.githubusercontent.com/Yogesh-Kumar-Mallik-dev/ChessPasant/main/apps/web/static/icons/archlinux.svg" width="16" height="16" valign="middle" /> **Arch Linux** | `chesspasant-${{ github.ref_name }}-1-x86_64.pkg.tar.zst` | x86_64 | Pacman (`sudo pacman -U`) |
            | <img src="https://raw.githubusercontent.com/Yogesh-Kumar-Mallik-dev/ChessPasant/main/apps/web/static/icons/archlinux.svg" width="16" height="16" valign="middle" /> **Arch Linux / AUR** | `ChessPasant_${{ github.ref_name }}_x86_64.tar.gz` | x86_64 | Standalone / `makepkg` |
            | <img src="https://raw.githubusercontent.com/Yogesh-Kumar-Mallik-dev/ChessPasant/main/apps/web/static/icons/tux.svg" width="16" height="16" valign="middle" /> **Linux (Universal)** | `ChessPasant_${{ github.ref_name }}_amd64.AppImage` | x86_64 / amd64 | Portable (All distributions) |
            | <img src="https://raw.githubusercontent.com/Yogesh-Kumar-Mallik-dev/ChessPasant/main/apps/web/static/icons/tux.svg" width="16" height="16" valign="middle" /> **Linux (Debian/Ubuntu)** | `chesspasant_${{ github.ref_name }}_amd64.deb` | x86_64 / amd64 | APT / dpkg |
            | <img src="https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/windows11.svg" width="16" height="16" valign="middle" /> **Windows** | `ChessPasant_${{ github.ref_name }}_x64-setup.exe` | x64 | Windows 10 & 11 Setup |
            | <img src="https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/windows11.svg" width="16" height="16" valign="middle" /> **Windows** | `ChessPasant_${{ github.ref_name }}_x64_en-US.msi` | x64 | Enterprise MSI Installer |
            | <img src="https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/apple.svg" width="16" height="16" valign="middle" /> **macOS** | `ChessPasant_${{ github.ref_name }}_universal.dmg` | Universal Binary | Apple Silicon (M1/M2/M3/M4) & Intel |

            ---

            ### Highlights in this Release
            - Dual Stockfish 19 Engine: Integrated native Stockfish 19 UCI engine with baseline depth 14 search (depth 16 endgame scaling) and client-side Stockfish 19 Lite WASM with embedded NNUE neural network (`nn-61e7af4bb97d.nnue`).
            - Grandmaster Tactical Review Coach: Real-time evaluation curves with tactical motif classification (Forks, Pins, Hanging Blunders, Discovered Checks, Queen Trades, Sacrifices, and Missed Wins).
            - Ultra-Lightweight & Blazing Fast: Engineered with Rust and native webview components, consuming under 60 MB RAM compared to heavy Electron alternatives.
            - Native Window Manager & Tiling Integration: Seamlessly integrates with system window managers and tiling setups (Hyprland, Sway, i3) with native OS controls on Windows and macOS.
            - 100% Offline Capable: Play against AI bots, enjoy local pass-and-play, and analyze games with zero internet connection required.

            ---

            ### Installation Notes
            - **Arch Linux**: Run `sudo pacman -U chesspasant-*.pkg.tar.zst` or extract `ChessPasant_*_x86_64.tar.gz` and run `./install.sh`.
            - **Linux AppImage**: Run `chmod +x ChessPasant_*.AppImage && ./ChessPasant_*.AppImage`.
            - **Linux DEB**: Run `sudo dpkg -i chesspasant_*.deb` or double-click to install via your software center.
            - **Windows**: Launch the `.exe` or `.msi`. If Windows Defender SmartScreen displays a warning, click **More info** -> **Run anyway**.
            - **macOS**: Mount the `.dmg` and drag ChessPasant into your `Applications` folder. On first launch, right-click (or Control-click) and select **Open** to approve the Gatekeeper security prompt.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build Arch Linux Packages (.pkg.tar.zst & .tar.gz)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get install -y zstd
          RAW_TAG="${{ github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          VERSION="${VERSION:-0.1.0}"
          chmod +x ./packaging/arch/package-arch.sh
          ./packaging/arch/package-arch.sh "$VERSION" "$GITHUB_WORKSPACE/apps/desktop/src-tauri/target/release/bundle/arch"

      - name: Upload Arch Linux Release Assets
        if: matrix.platform == 'ubuntu-22.04'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/src-tauri/target/release/bundle/arch/*.pkg.tar.zst
            apps/desktop/src-tauri/target/release/bundle/arch/*.tar.gz
            apps/desktop/src-tauri/target/release/bundle/arch/PKGBUILD
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chesspasant-${{ matrix.platform }}-bundles
          path: |
            apps/desktop/src-tauri/target/release/bundle/
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/
          if-no-files-found: warn
