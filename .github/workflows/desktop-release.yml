name: Desktop Release & Cross-Compilation

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_draft:
        description: 'Publish as Draft Release on GitHub'
        required: true
        type: boolean
        default: false

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
            bundle_ext: 'dmg, app'
          - platform: 'ubuntu-22.04'
            args: ''
            bundle_ext: 'AppImage, deb'
          - platform: 'windows-latest'
            args: ''
            bundle_ext: 'msi, exe'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/desktop/package-lock.json

      - name: Install Linux GUI Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Frontend Dependencies
        run: |
          npm --prefix apps/web ci || npm --prefix apps/web install
          npm --prefix apps/desktop ci || npm --prefix apps/desktop install

      - name: Build Web Frontend Assets
        run: npm --prefix apps/web run build

      - name: Build Tauri Desktop Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: './apps/desktop'
          tagName: ${{ github.ref_name }}
          releaseName: 'ChessNova Desktop ${{ github.ref_name }}'
          releaseBody: |
            ## ♟ ChessNova Desktop (${{ github.ref_name }})

            Welcome to the official cross-platform desktop release of **ChessNova** — a modern, distraction-free chess platform and tactical analysis laboratory engineered with **Rust** and **Tauri v2**.

            ---

            ### 📦 Download Packages by Operating System

            | Platform | File | Type | Architecture |
            | :--- | :--- | :--- | :--- |
            | 🐧 **Linux** | `ChessNova_${{ github.ref_name }}_amd64.AppImage` | Portable (Zero Install) | x86_64 / amd64 |
            | 🐧 **Linux** | `chessnova_${{ github.ref_name }}_amd64.deb` | Debian / Ubuntu Package | x86_64 / amd64 |
            | 🪟 **Windows** | `ChessNova_${{ github.ref_name }}_x64-setup.exe` | Standard Windows Installer | x64 (Windows 10/11) |
            | 🪟 **Windows** | `ChessNova_${{ github.ref_name }}_x64_en-US.msi` | MSI Enterprise Package | x64 (Windows 10/11) |
            | 🍏 **macOS** | `ChessNova_${{ github.ref_name }}_universal.dmg` | Disk Image (Universal) | Apple Silicon (M1/M2/M3/M4) & Intel |

            ---

            ### ✨ Highlights in this Release
            - 🧠 **Dual Stockfish 19 Engine**: Integrated native Stockfish 19 UCI engine with baseline depth 14 search (depth 16 endgame scaling) and client-side Stockfish 19 Lite WASM with embedded NNUE neural network (`nn-61e7af4bb97d.nnue`).
            - 🔬 **Grandmaster Tactical Review Coach**: Real-time evaluation curves with tactical motif classification (Forks, Pins, Hanging Blunders, Discovered Checks, Queen Trades, Sacrifices, and Missed Wins).
            - ⚡ **Ultra-Lightweight & Blazing Fast**: Engineered with Rust and native webview components, consuming under 60 MB RAM compared to heavy Electron alternatives.
            - 🎨 **Frameless Studio Noir Design**: Custom desktop window titlebar with system controls, bespoke Staunton vector SVG pieces, and dynamic multi-theme engine (Dark Slate, Chess Classic, OLED Black, Emerald Studio).
            - 📶 **100% Offline Capable**: Play against AI bots, enjoy local pass-and-play, and analyze games with zero internet connection required.

            ---

            ### 🚀 Installation Notes
            - **Linux AppImage**: Run `chmod +x ChessNova_*.AppImage && ./ChessNova_*.AppImage`.
            - **Linux DEB**: Run `sudo dpkg -i chessnova_*.deb` or double-click to install via your software center.
            - **Windows**: Launch the `.exe` or `.msi`. If Windows Defender SmartScreen displays a warning, click **More info** -> **Run anyway**.
            - **macOS**: Mount the `.dmg` and drag ChessNova into your `Applications` folder. On first launch, right-click (or Control-click) and select **Open** to approve the Gatekeeper security prompt.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chessnova-${{ matrix.platform }}-bundles
          path: |
            apps/desktop/src-tauri/target/release/bundle/
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/
          if-no-files-found: warn
