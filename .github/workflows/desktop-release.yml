name: Desktop Release & Cross-Compilation

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_draft:
        description: 'Publish as Draft Release on GitHub'
        required: true
        type: boolean
        default: true

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
            bundle_ext: 'dmg, app'
          - platform: 'ubuntu-22.04'
            args: ''
            bundle_ext: 'AppImage, deb'
          - platform: 'windows-latest'
            args: ''
            bundle_ext: 'msi, exe'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/desktop/package-lock.json

      - name: Install Linux GUI Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Frontend Dependencies
        run: |
          npm --prefix apps/web ci || npm --prefix apps/web install
          npm --prefix apps/desktop ci || npm --prefix apps/desktop install

      - name: Build Web Frontend Assets
        run: npm --prefix apps/web run build

      - name: Build Tauri Desktop Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: './apps/desktop'
          tagName: ${{ github.ref_name }}
          releaseName: 'ChessNova Desktop ${{ github.ref_name }}'
          releaseBody: 'Cross-platform desktop native release of ChessNova with frameless window styling and native system tray.'
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' && inputs.release_draft || true }}
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chessnova-${{ matrix.platform }}-bundles
          path: |
            apps/desktop/src-tauri/target/release/bundle/
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/
          if-no-files-found: warn
