name: Mobile Release & Packaging (Android & iOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach binaries to (e.g. v0.1.6)'
        required: true
        type: string
        default: 'v0.1.7'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK, NDK & Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          
          # Use pre-installed NDK from GitHub Actions runner or install latest
          if [ -d "$ANDROID_HOME/ndk" ] && [ "$(ls -A "$ANDROID_HOME/ndk" 2>/dev/null)" ]; then
            LATEST_NDK=$(ls "$ANDROID_HOME/ndk" | sort -V | tail -n 1)
            echo "Using pre-installed Android NDK: $LATEST_NDK"
            echo "NDK_HOME=$ANDROID_HOME/ndk/$LATEST_NDK" >> $GITHUB_ENV
          else
            echo "Installing NDK via sdkmanager..."
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.3.11579264"
            echo "NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV
          fi
          
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/mobile/package-lock.json

      - name: Install Dependencies
        run: |
          npm --prefix apps/web ci || npm --prefix apps/web install
          npm --prefix apps/mobile ci || npm --prefix apps/mobile install

      - name: Build Web Frontend Assets
        run: npm --prefix apps/web run build

      - name: Initialize Android Project
        working-directory: apps/mobile
        run: |
          npx tauri android init --ci

      - name: Configure Android Signing Keystore
        working-directory: apps/mobile
        run: |
          mkdir -p src-tauri/gen/android
          keytool -genkeypair -v -keystore /tmp/release.jks -keyalg RSA -keysize 2048 -validity 10000 \
            -alias release -storepass chesspasant -keypass chesspasant \
            -dname "CN=ChessPasant,O=ChessPasant,C=US"

          cat <<EOF > src-tauri/gen/android/keystore.properties
          password=chesspasant
          keyAlias=release
          storeFile=/tmp/release.jks
          EOF

      - name: Build Android APK
        working-directory: apps/mobile
        run: |
          npx tauri android build --apk --ci --target aarch64 || \
          npx tauri android build --apk --ci -d --target aarch64

      - name: Prepare and Verify APK Binary
        run: |
          RAW_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          VERSION="${VERSION:-0.1.7}"

          mkdir -p dist/mobile
          echo "==> Searching for generated APK files..."
          find apps/mobile/src-tauri/gen/android/ -type f -name "*.apk" -ls || true

          APK_FILE=$(find apps/mobile/src-tauri/gen/android/ -type f -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            echo "==> Found APK: $APK_FILE"
            cp "$APK_FILE" "dist/mobile/ChessPasant_${VERSION}.apk"

            APKSIGNER=$(find $ANDROID_HOME/build-tools/ -name apksigner | sort -V | tail -n 1)
            if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
              echo "==> Verifying / signing APK with $APKSIGNER..."
              "$APKSIGNER" sign --ks /tmp/release.jks --ks-pass pass:chesspasant --ks-key-alias release "dist/mobile/ChessPasant_${VERSION}.apk" || true
            fi
            echo "==> Successfully created: dist/mobile/ChessPasant_${VERSION}.apk"
          else
            echo "ERROR: No APK generated"
            exit 1
          fi

      - name: Upload Android APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: 'ChessPasant ${{ github.event.inputs.tag || github.ref_name }}'
          body_path: .github/release-notes.md
          files: dist/mobile/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chesspasant-android-apk
          path: dist/mobile/*.apk
          if-no-files-found: warn

  build-ios:
    name: Build iOS Application
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/mobile/package-lock.json

      - name: Install Dependencies
        run: |
          npm --prefix apps/web ci || npm --prefix apps/web install
          npm --prefix apps/mobile ci || npm --prefix apps/mobile install

      - name: Build Web Frontend Assets
        run: npm --prefix apps/web run build

      - name: Initialize iOS Project
        working-directory: apps/mobile
        run: |
          npx tauri ios init --ci

      - name: Build iOS Application
        working-directory: apps/mobile
        continue-on-error: true
        run: |
          npx tauri ios build --ci --debug --target aarch64-apple-ios-sim || \
          npx tauri ios build --ci --debug || \
          echo "iOS build initialized Xcode workspace"

      - name: Package iOS IPA & Application Bundle
        run: |
          RAW_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          VERSION="${VERSION:-0.1.7}"

          mkdir -p dist/ios/Payload
          echo "==> Searching for generated iOS .app bundles..."
          find apps/mobile/src-tauri/gen/apple/ -name "*.app" -maxdepth 6 || true

          APP_DIR=$(find apps/mobile/src-tauri/gen/apple/ -name "*.app" | head -n 1)
          if [ -n "$APP_DIR" ] && [ -d "$APP_DIR" ]; then
            echo "==> Found iOS App: $APP_DIR"
            cp -r "$APP_DIR" dist/ios/Payload/
            cd dist/ios
            zip -r "ChessPasant_${VERSION}_unsigned.ipa" Payload
            cd -
            echo "==> Packaged: dist/ios/ChessPasant_${VERSION}_unsigned.ipa"
          fi

          # Also package Xcode project workspace for developers/sideloaders
          if [ -d "apps/mobile/src-tauri/gen/apple" ]; then
            echo "==> Packaging iOS Xcode Project..."
            cd apps/mobile/src-tauri/gen/apple/
            zip -rq "$GITHUB_WORKSPACE/dist/ios/ChessPasant_${VERSION}_ios_xcode.zip" .
            cd -
          fi

      - name: Upload iOS Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: 'ChessPasant ${{ github.event.inputs.tag || github.ref_name }}'
          body_path: .github/release-notes.md
          files: |
            dist/ios/*.ipa
            dist/ios/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chesspasant-ios-bundle
          path: dist/ios/
          if-no-files-found: warn
