name: Update Release Notes

on:
  push:
    branches:
      - main
    paths:
      - '.github/release-notes.md'
      - '.github/workflows/update-release.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to update release notes for'
        default: 'v0.1.7'
        required: true

jobs:
  publish-release-notes:
    name: Publish Release Notes to GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update GitHub Release Body & Notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || 'v0.1.7' }}
          name: 'ChessPasant ${{ github.event.inputs.tag || 'v0.1.7' }}'
          body_path: .github/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
