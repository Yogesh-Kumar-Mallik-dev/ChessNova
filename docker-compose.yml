name: chessnova

services:
  mongodb:
    image: mongo:7
    container_name: chess-mongo
    restart: always
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=chess

  redis:
    image: redis:7-alpine
    container_name: chess-redis
    restart: always
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: chess-minio
    restart: always
    command: server /data --console-address ":9001"
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=miniopassword123

volumes:
  mongo_data:
  redis_data:
  minio_data:
